<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch & Kick - Préférences</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="shortcut icon" href="../assets/img/favicon.svg" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h3 class="brand-sub">CATCH & KICK</h3>
        <h1>TES PRÉFÉRENCES</h1>
    </header>

    <main_preference>
        <section class="question-block">
            <h2>QUESTION 1</h2>
            <p>Qu'est-ce que tu préfères le plus ?</p>
            <div class="button-group">
                <button class="btn-red">CHAUSSURES</button>
                <button class="btn-red">VÊTEMENTS</button>
            </div>
        </section>

        <section class="question-block">
            <h2>QUESTION 2</h2>
            <p>Quel style te correspond le mieux ?</p>
            <div class="button-group">
                <button class="btn-red">SPORT</button>
                <button class="btn-red">LIFESTYLE</button>
            </div>
        </section>

        <div class="footer-actions">
            <a class="cta-button" href="./game.html">JOUER</a>
        <div class="back-container">
            <a class="btn-back" href="../index.html">↩</a>
        </div>
        </div>
    </main>

    <img src="../assets/img/Big/stickers_left.png" alt="stickers" class="overlay-stickers left">
    <img src="../assets/img/Big/stickers_right.png" alt="stickers" class="overlay-stickers right">

    <div class="stickers-container-medium">
        <img src="../assets/img/Medium/stickers_left_medium.png" alt="stickers" class="overlay-stickers-medium left">
        <img src="../assets/img/Medium/stickers_right_medium.png" alt="stickers" class="overlay-stickers-medium right">
    </div>

    <div class="stickers-container-mobile">
        <img src="../assets/img/Small/Bottom_left_stickers.png" alt="stickers corner" class="sticker bottom-left">
        <img src="../assets/img/Small/Bottom_right_stickers.png" alt="stickers corner" class="sticker bottom-right">
        <img src="../assets/img/Small/Top_left_stickers.png" alt="stickers corner" class="sticker top-left">
        <img src="../assets/img/Small/Top_right_stickers.png" alt="stickers corner" class="sticker top-right">
    </div>
</body>
</html>
