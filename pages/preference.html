<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch & Kick - Préférences</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>

        <header>
            <p class="brand">CATCH & KICK</p>
            <h1>TES PRÉFÉRENCES</h1>
        </header>

        <main>
            <section class="question-block">
                <h2>QUESTION 1</h2>
                <p>Qu'est-ce que tu préfères le plus ?</p>
                <div class="button-group">
                    <button class="btn-red">CHAUSSURES</button>
                    <button class="btn-red">VÊTEMENTS</button>
                </div>
            </section>

            <section class="question-block">
                <h2>QUESTION 2</h2>
                <p>Quel style te correspond le mieux ?</p>
                <div class="button-group">
                    <button class="btn-red">SPORT</button>
                    <button class="btn-red">LIFESTYLE</button>
                </div>
            </section>

            <div class="footer-actions">
                <button class="btn-play">JOUER</button>
                <div class="back-container">
                    <button class="btn-back">↩</button>
                </div>
            </div>
        </main>

        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>
    </div>
</body>
</html>
